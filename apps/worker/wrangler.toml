name = "whisperlink"
main = "src/index.ts"
compatibility_date = "2024-12-18"
compatibility_flags = ["nodejs_compat"]

pages_build_output_dir = "../web/dist"

[assets]
directory = "../web/dist"
not_found_handling = "single-page-application"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_classes = ["Room"]

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "00000000000000000000000000000000"
preview_id = "00000000000000000000000000000001"

[vars]
SESSION_RATE_LIMIT_PER_HOUR = "10"
PASSCODE_MAX_ATTEMPTS = "5"
PASSCODE_LOCKOUT_MINUTES = "15"

[dev]
port = 8787
