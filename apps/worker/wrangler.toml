name = "whisperlink"
main = "src/index.ts"
compatibility_date = "2024-12-18"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = "../web/dist"
not_found_handling = "single-page-application"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_classes = ["Room"]

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "1867dd716c69476ba8bf299ff138613f"
preview_id = "1867dd716c69476ba8bf299ff138613f"

[vars]
SESSION_RATE_LIMIT_PER_HOUR = "10"
PASSCODE_MAX_ATTEMPTS = "5"
PASSCODE_LOCKOUT_MINUTES = "15"

[dev]
port = 8787
